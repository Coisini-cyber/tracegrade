[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegrade"
version = "0.1.0"
description = "Compile production agent traces into replayable regression evals."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tracegrade contributors" }]
keywords = [
    "llm",
    "agents",
    "evaluation",
    "evals",
    "traces",
    "regression-testing",
    "replay",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Coisini-cyber/tracegrade"
Issues = "https://github.com/Coisini-cyber/tracegrade/issues"

[project.scripts]
tracegrade = "tracegrade.cli:main"

[tool.setuptools]
packages = ["tracegrade"]
