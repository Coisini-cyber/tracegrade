name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q tracegrade
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: End-to-end demo
        run: |
          tracegrade demo -o /tmp/demo
          tracegrade compile /tmp/demo/traces.jsonl -o /tmp/cases.jsonl
          tracegrade replay /tmp/cases.jsonl --agent "python /tmp/demo/mock_agent.py" \
            --min-pass-rate 1.0 -o /tmp/report.md --json /tmp/report.json --quiet
          tracegrade lint /tmp/cases.jsonl
      - name: No third-party imports
        run: python scripts/check_stdlib_only.py
